{% extends 'base.html' %}

{% block title %}Sign Up - Movie Magic{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="glass-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-circle mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 class="fw-bold text-white">Create Account</h3>
        <p class="text-muted small">Join Movie Magic for instant seat reservation & cloud tickets</p>
      </div>

      <form action="{{ url_for('register') }}" method="POST">
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-at"></i></span>
            <input type="text" name="username" class="form-control bg-dark border-secondary text-white" placeholder="Choose a username" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" name="email" class="form-control bg-dark border-secondary text-white" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-white" placeholder="Create password" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small fw-bold">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-shield"></i></span>
            <input type="password" name="confirm_password" class="form-control bg-dark border-secondary text-white" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-magic w-100 py-3 fw-bold mb-3">
          Register Account <i class="fa-solid fa-check-circle ms-1"></i>
        </button>

        <div class="text-center small text-muted">
          Already have an account? <a href="{{ url_for('login') }}" class="text-danger fw-bold">Log in here</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
